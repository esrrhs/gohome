# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # Fast static gates — gofmt / vet / lint run in parallel with tests.
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.3'

    - name: Build
      run: |
        go mod tidy
        go build -v ./...

    # crypto/cryptonight/inter 与 arith_ref.go 是从上游移植的算法实现，
    # 保留其原始排版以便跟随上游同步，因此不纳入本仓库的 gofmt 约束。
    - name: Gofmt
      run: |
        set -euo pipefail
        files=$(git ls-files '*.go' | grep -v -e '^crypto/cryptonight/inter/' -e '^crypto/cryptonight/arith_ref.go' || true)
        bad=$(gofmt -l ${files})
        if [ -n "${bad}" ]; then
          echo "The following files are not gofmt'ed:"
          echo "${bad}"
          gofmt -d ${bad}
          exit 1
        fi

    # crypto/cryptonight/inter 是从上游移植的算法实现（含 amd64 汇编），
    # Go 1.26 的 asmdecl 检查会对其汇编命名报错；与 Gofmt 步骤一致，
    # 这些跟随上游同步的目录不纳入本仓库的 vet 门禁。
    - name: Vet
      run: |
        set -euo pipefail
        go vet $(go list ./... | grep -v '/crypto/cryptonight/inter/')

    # 静态检查走 .golangci.yml 里收敛过的规则集（已排除 quickfix 风格改写、
    # 会触碰公开 API 签名与既有日志文案的检查，以及 inter/ 上游移植目录）。
    # 版本号与配置同步升级，避免 install.sh 取到不兼容的新默认规则。
    - name: Lint
      run: |
        set -euo pipefail
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.14.0/install.sh \
          | sh -s -- -b "$(go env GOPATH)/bin" v2.14.0
        "$(go env GOPATH)/bin/golangci-lint" run --timeout 10m

  # Unit tests + coverage. network 单包非 race 约 500s，逼近默认 10m 上限。
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.3'

    - name: Test
      run: go test -v -timeout 20m -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.txt

  # 竞态检测：快包与慢包拆开并行，缩短 wall clock。
  race-fast:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.3'

    - name: Test with race detector (fast packages)
      run: |
        go test -race -count=1 -timeout 20m ./common/... ./list/... ./lru/... ./pool/... ./thread/... ./dns/... ./loggo/... ./platform/... ./thirdparty/...

  # cryptonight/inter 是上游移植实现，其 sha3 测试做 unsafe 非对齐访问，
  # Go 1.26 -race 的 checkptr 会 fatal；与 Gofmt/Vet 一致排除。
  # network 在 -race 下约 610s，25m 留余量。
  race-slow:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.3'

    - name: Test with race detector (network & crypto)
      run: |
        set -euo pipefail
        go test -race -count=1 -timeout 25m ./network/... $(go list ./crypto/... | grep -v '/crypto/cryptonight/inter/')
