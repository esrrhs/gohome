# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.27.3'

    - name: Build
      run: |
        go mod tidy
        go build -v ./...

    # crypto/cryptonight/inter 与 arith_ref.go 是从上游移植的算法实现，
    # 保留其原始排版以便跟随上游同步，因此不纳入本仓库的 gofmt 约束。
    - name: Gofmt
      run: |
        set -euo pipefail
        files=$(git ls-files '*.go' | grep -v -e '^crypto/cryptonight/inter/' -e '^crypto/cryptonight/arith_ref.go' || true)
        bad=$(gofmt -l ${files})
        if [ -n "${bad}" ]; then
          echo "The following files are not gofmt'ed:"
          echo "${bad}"
          gofmt -d ${bad}
          exit 1
        fi

    # crypto/cryptonight/inter 是从上游移植的算法实现（含 amd64 汇编），
    # Go 1.26 的 asmdecl 检查会对其汇编命名报错；与 Gofmt 步骤一致，
    # 这些跟随上游同步的目录不纳入本仓库的 vet 门禁。
    - name: Vet
      run: |
        set -euo pipefail
        go vet $(go list ./... | grep -v '/crypto/cryptonight/inter/')

    # 静态检查走 .golangci.yml 里收敛过的规则集（已排除 quickfix 风格改写、
    # 会触碰公开 API 签名与既有日志文案的检查，以及 inter/ 上游移植目录）。
    # 版本号与配置同步升级，避免 install.sh 取到不兼容的新默认规则。
    - name: Lint
      run: |
        set -euo pipefail
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.14.0/install.sh \
          | sh -s -- -b "$(go env GOPATH)/bin" v2.14.0
        "$(go env GOPATH)/bin/golangci-lint" run --timeout 10m

    # network 包单包非 race 就要约 500s，逼近 go test 默认的 10m 上限，
    # 机器负载稍高就会被误判成超时失败，因此显式放宽。
    - name: Test
      run: go test -v -timeout 20m ./...

    # 竞态检测分两步：先跑并发原语密集的快包，快速拿到反馈；
    # network / crypto 全量带 -race 需要十几分钟，单独一步便于定位。
    # -race 插桩下 network 全套件约 610s，远超 go test 默认的 10m 上限
    # （会在测试刚起步时就被 panic: test timed out 打断），必须放宽超时。
    - name: Test with race detector
      run: |
        go test -race -count=1 -timeout 20m ./common/... ./list/... ./lru/... ./pool/... ./thread/... ./dns/... ./loggo/... ./platform/... ./thirdparty/...

    # cryptonight/inter 是 Go 作者上游移植的算法实现，其 sha3 测试专门做
    # unsafe 非对齐指针访问，Go 1.26 的 -race 内置 checkptr 会直接 fatal；
    # 与 Gofmt/Vet 步骤一致，上游同步目录不纳入本仓库门禁，这些包仍由普通
    # Test 步骤与 Big Endian 工作流覆盖。
    - name: Test with race detector (network & crypto)
      run: |
        set -euo pipefail
        # network 在 -race 插桩下约需 610s，25m 为其留出约 2.5 倍余量，
        # 避免 CI 机器负载波动再次触发默认 10m 超时。
        go test -race -count=1 -timeout 25m ./network/... $(go list ./crypto/... | grep -v '/crypto/cryptonight/inter/')

    # Raw ICMP tests (IPv4 and IPv6 loopback) need CAP_NET_RAW; without it
    # they self-skip. Build a dedicated test binary and grant the capability
    # via setcap, falling back to sudo where setcap is unavailable. The
    # DgramClient v4 case pairs a privileged raw listener with an
    # unprivileged udp4 client (datagram fallback / echo-id translation);
    # CAP_NET_RAW alone does not authorize SOCK_DGRAM ping sockets, so widen
    # net.ipv4.ping_group_range (the unprivileged runner gid is outside the
    # default range). ICMPv6 has no unprivileged dgram path (Linux does not
    # deliver dgram-sent v6 echo requests to raw listeners; Darwin lacks v6
    # dgram support), so v6 stays on the raw tests above.
    - name: Test privileged raw ICMP (IPv4/IPv6)
      run: |
        set -euo pipefail
        sudo sysctl -w net.ipv4.ping_group_range='0 2147483647'
        go test -c -o "${RUNNER_TEMP}/network.test" ./network
        PAT='^(TestRicmpAcceptImmediateReadWrite|TestRicmpAcceptImmediateReadWriteIPv6|TestRicmpDgramClientIPv4)$'
        if sudo setcap cap_net_raw+ep "${RUNNER_TEMP}/network.test" 2>/dev/null; then
          "${RUNNER_TEMP}/network.test" -test.v -test.count=1 -test.timeout=5m -test.run "$PAT"
        else
          sudo --preserve-env=PATH,GOROOT,GOPATH,HOME,GOCACHE,GOMODCACHE,GOPROXY \
            "${RUNNER_TEMP}/network.test" -test.v -test.count=1 -test.timeout=5m -test.run "$PAT"
        fi
