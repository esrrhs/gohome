# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.26'

    - name: Build
      run: |
        go mod tidy
        go build -v ./...

    - name: Test
      run: go test -v ./...

    # Raw ICMP tests (IPv4 and IPv6 loopback) need CAP_NET_RAW; without it
    # they self-skip. Build a dedicated test binary and grant the capability
    # via setcap, falling back to sudo where setcap is unavailable. The
    # DgramClient cases pair a privileged raw listener with an unprivileged
    # udp4/udp6 client (datagram fallback / echo-id translation). CAP_NET_RAW
    # alone does not authorize SOCK_DGRAM ping sockets: the unprivileged
    # gid must be inside net.ipv4.ping_group_range (one range governs both
    # ICMPv4 and ICMPv6), which defaults to disabled on Ubuntu, so widen it.
    - name: Test privileged raw ICMP (IPv4/IPv6)
      run: |
        set -euo pipefail
        sudo sysctl -w net.ipv4.ping_group_range='0 2147483647'
        go test -c -o "${RUNNER_TEMP}/network.test" ./network
        PAT='^(TestRicmpAcceptImmediateReadWrite|TestRicmpAcceptImmediateReadWriteIPv6|TestRicmpDgramClientIPv4|TestRicmpDgramClientIPv6)$'
        export RICMP_DEBUG=1
        sudo tcpdump -i lo -n -vvv icmp6 -w /tmp/icmp6.pcap >/tmp/tcpdump.log 2>&1 &
        TPID=$!
        sleep 1
        if sudo setcap cap_net_raw+ep "${RUNNER_TEMP}/network.test" 2>/dev/null; then
          "${RUNNER_TEMP}/network.test" -test.v -test.count=1 -test.timeout=5m -test.run "$PAT"
        else
          sudo --preserve-env=PATH,GOROOT,GOPATH,HOME,GOCACHE,GOMODCACHE,GOPROXY \
            "${RUNNER_TEMP}/network.test" -test.v -test.count=1 -test.timeout=5m -test.run "$PAT"
        fi
        RC=$?
        sleep 1
        sudo kill "$TPID" 2>/dev/null || true
        sudo tcpdump -n -vvv -r /tmp/icmp6.pcap 2>/dev/null | grep -E 'echo (request|reply)' | tail -40
        exit "$RC"
