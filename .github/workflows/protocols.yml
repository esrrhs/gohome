name: Protocols

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  protocol:
    name: protocol (${{ matrix.protocol }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - protocol: tcp
            selector: '^TestTcpListenCloseJoinEcho$'
          - protocol: udp
            selector: '^TestUdpCloseJoinEcho$'
          - protocol: rudp
            selector: '^TestRudpAcceptImmediateReadWrite$'
          - protocol: kcp
            selector: '^TestKcp(AcceptImmediateReadWrite|FecLoopback)$'
          - protocol: quic
            selector: '^TestQuicAcceptImmediateReadWrite$'
          - protocol: rhttp
            selector: '^TestRhttpH(1|2C)ReusesConnection$'
          - protocol: wss
            selector: '^TestWss'
          - protocol: rdns
            selector: '^TestRdns'
          - protocol: ricmp
            selector: '^TestRicmp(AcceptImmediateReadWrite|AcceptImmediateReadWriteIPv6|DgramClientIPv4)$'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Protocol integration tests (race)
        if: matrix.protocol != 'ricmp'
        env:
          SELECTOR: ${{ matrix.selector }}
        run: |
          set -euo pipefail
          go test -race -json -count=1 -timeout=5m -run "$SELECTOR" ./network > protocol.json
      # Move the former Go/icmp gate here; raw sockets must actually run, not skip.
      - name: Privileged raw ICMP (IPv4 and IPv6)
        if: matrix.protocol == 'ricmp'
        env:
          SELECTOR: ${{ matrix.selector }}
        run: |
          set -euo pipefail
          sudo sysctl -w net.ipv4.ping_group_range='0 2147483647'
          go test -race -c -o "${RUNNER_TEMP}/network.test" ./network
          if sudo setcap cap_net_raw+ep "${RUNNER_TEMP}/network.test"; then
            "${RUNNER_TEMP}/network.test" -test.v -test.count=1 -test.timeout=5m -test.run "$SELECTOR" \
              | go tool test2json -t -p github.com/esrrhs/gohome/network > protocol.json
          else
            sudo --preserve-env=PATH,GOROOT,GOPATH,HOME,GOCACHE,GOMODCACHE,GOPROXY \
              "${RUNNER_TEMP}/network.test" -test.v -test.count=1 -test.timeout=5m -test.run "$SELECTOR" \
              | go tool test2json -t -p github.com/esrrhs/gohome/network > protocol.json
          fi
      - name: Require real passing tests (no empty or skipped matrix entries)
        run: python3 scripts/check-protocol-tests.py protocol.json
      - name: Test log
        if: always()
        run: cat protocol.json
